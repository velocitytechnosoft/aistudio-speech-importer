<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 16px;
      background: #18191b;
      color: #e3e3e3;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 12.5px;
      color: #9aa0a6;
      line-height: 1.45;
    }
    button {
      width: 100%;
      background: #8ab4f8;
      color: #0d1117;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #aecbfa;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #f28b82;
      display: none;
    }
  </style>
</head>
<body>
  <h3>🎙️ AI Studio Script Importer</h3>
  <p>Open the full-script importer directly inside your active Google AI Studio Speech Playground tab.</p>
  <button id="open-modal-btn">📋 Open Script Importer</button>
  <div class="status" id="status-msg"></div>
  <script src="popup.js"></script>
</body>
</html>
